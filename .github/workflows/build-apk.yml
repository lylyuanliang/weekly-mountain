name: Build and Release Android APK

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（留空则自动提取自 public/version.json）'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release Dual APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Install Platform 36
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install dependencies
        run: npm ci

      - name: Resolve Version and Tag
        id: resolve_version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(node -p "require('./public/version.json').versionTag || ('v' + require('./public/version.json').version)")
          fi
          echo "Resolved Tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Configure Android SDK local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================================================================
      # 阶段 1：构建正式发布版 (Release - Zero-DCE)
      # =========================================================================
      - name: Build Web Assets (Release)
        run: npm run build:release

      - name: Sync Web Assets to Android (Release)
        run: |
          chmod +x node_modules/.bin/* || true
          npx cap sync android || true
          node scripts/sync_android_assets.js
          echo "=== Verifying Synced Release Assets in Android ==="
          test -f android/app/src/main/assets/public/index.html || {
            echo "### ERROR: index.html missing from Android assets!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          test -f android/app/src/main/assets/capacitor.config.json || {
            echo "### ERROR: capacitor.config.json missing from Android assets!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          COUNT=$(find android/app/src/main/assets/public/assets/mountains -type f 2>/dev/null | wc -l || echo 0)
          echo "Total Mountain Assets in Android (Release): $COUNT files"
          if [ "$COUNT" -lt 50 ]; then
            echo "### ERROR: Less than 50 mountain assets found in Android assets directory!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Compile Android Release APK
        working-directory: android
        run: |
          echo "=== Java Environment ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          set -o pipefail
          ./gradlew clean assembleRelease --no-build-cache --stacktrace --no-daemon 2>&1 | tee ../gradle_release.log

      - name: Report Release Build Failure
        if: failure()
        run: |
          echo "### Gradle Release Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_release.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E -C 5 "FAILED|error:|Exception|FAILURE:" gradle_release.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo "=== TAIL OF LOG ===" >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No gradle_release.log found at root." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Release APK
        run: |
          echo "=== Verifying and Archiving Release APK ==="
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "### ERROR: Canonical Release APK not found at $APK_FILE!" >> $GITHUB_STEP_SUMMARY
            find android/app/build/ -ls >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_FILE")
          echo "Canonical Release APK Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 20000000 ]; then
            echo "### ERROR: Release APK size ($APK_SIZE bytes) is suspiciously under 20 MB! Assets might be missing!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "=== Inspecting APK Internal Files ==="
          unzip -l "$APK_FILE" | grep "assets/public/index.html" || {
            echo "### ERROR: assets/public/index.html missing inside Release APK!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          unzip -l "$APK_FILE" | grep "assets/capacitor.config.json" || {
            echo "### ERROR: assets/capacitor.config.json missing inside Release APK!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "Copying $APK_FILE to weekly-mountain-${{ env.TAG }}-release.apk"
          cp "$APK_FILE" "weekly-mountain-${{ env.TAG }}-release.apk"
          ls -lh "weekly-mountain-${{ env.TAG }}-release.apk"
          rm -rf android/app/build/outputs/apk

      # =========================================================================
      # 阶段 2：构建内测调试版 (Debug - 集成哨兵与悬浮球)
      # =========================================================================
      - name: Build Web Assets (Debug)
        run: npm run build

      - name: Sync Web Assets to Android (Debug)
        run: |
          chmod +x node_modules/.bin/* || true
          npx cap sync android || true
          node scripts/sync_android_assets.js
          echo "=== Verifying Synced Debug Assets in Android ==="
          test -f android/app/src/main/assets/public/index.html || {
            echo "### ERROR: index.html missing from Android assets!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          test -f android/app/src/main/assets/capacitor.config.json || {
            echo "### ERROR: capacitor.config.json missing from Android assets!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          COUNT=$(find android/app/src/main/assets/public/assets/mountains -type f 2>/dev/null | wc -l || echo 0)
          echo "Total Mountain Assets in Android (Debug): $COUNT files"
          if [ "$COUNT" -lt 50 ]; then
            echo "### ERROR: Less than 50 mountain assets found in Android assets directory!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --no-build-cache --stacktrace --no-daemon 2>&1 | tee ../gradle_debug.log

      - name: Report Debug Build Failure
        if: failure()
        run: |
          echo "### Gradle Debug Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_debug.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E -C 5 "FAILED|error:|Exception|FAILURE:" gradle_debug.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo "=== TAIL OF LOG ===" >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No gradle_debug.log found at root." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Debug APK
        run: |
          echo "=== Verifying and Archiving Debug APK ==="
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "### ERROR: Canonical Debug APK not found at $APK_FILE!" >> $GITHUB_STEP_SUMMARY
            find android/app/build/ -ls >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_FILE")
          echo "Canonical Debug APK Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 20000000 ]; then
            echo "### ERROR: Debug APK size ($APK_SIZE bytes) is suspiciously under 20 MB! Assets might be missing!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "=== Inspecting APK Internal Files ==="
          unzip -l "$APK_FILE" | grep "assets/public/index.html" || {
            echo "### ERROR: assets/public/index.html missing inside Debug APK!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          unzip -l "$APK_FILE" | grep "assets/capacitor.config.json" || {
            echo "### ERROR: assets/capacitor.config.json missing inside Debug APK!" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "Copying $APK_FILE to weekly-mountain-${{ env.TAG }}-debug.apk"
          cp "$APK_FILE" "weekly-mountain-${{ env.TAG }}-debug.apk"
          ls -lh "weekly-mountain-${{ env.TAG }}-debug.apk"

      # =========================================================================
      # 阶段 3：生成 Release 日志并发布
      # =========================================================================
      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > generate_notes.cjs
          const fs = require('fs');
          let versionInfo = {};
          try {
            versionInfo = JSON.parse(fs.readFileSync('public/version.json', 'utf8'));
          } catch (e) {
            console.error('Failed to read public/version.json', e);
          }
          const tag = process.env.TAG || 'v0.0.0';
          const title = versionInfo.title || `${tag} 成都周边50座山高精度真实轨迹与多路线对比系统`;
          const changelog = versionInfo.changelog || '1. 常规功能升级与性能优化；\n2. 高精度真实山峰数据与多路线体验更新。';

          const getFileSize = (filePath) => {
            if (fs.existsSync(filePath)) {
              const bytes = fs.statSync(filePath).size;
              return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }
            return '约 30 MB';
          };

          const releaseApk = `weekly-mountain-${tag}-release.apk`;
          const debugApk = `weekly-mountain-${tag}-debug.apk`;
          const releaseSize = getFileSize(releaseApk);
          const debugSize = getFileSize(debugApk);

          const notes = [
            `## 🏔️ ${title}`,
            '',
            '### 📝 更新日志',
            changelog,
            '',
            '---',
            '',
            '### 📦 安装包下载指引',
            '',
            '| 构建版本 | APK 文件名 | 文件大小 | 适用场景说明 |',
            '| :--- | :--- | :--- | :--- |',
            `| 🚀 **正式发布版 (Release)** | \`${releaseApk}\` | \`${releaseSize}\` | **推荐日常使用**：采用 Zero-DCE 纯净精简构建，已剔除调试悬浮球与哨兵诊断模块，启动飞快、性能最优。 |`,
            `| 🛠️ **内测调试版 (Debug)** | \`${debugApk}\` | \`${debugSize}\` | **公测与体验排障**：集成移动端真机反馈悬浮球、端侧切片录屏与实时诊断功能，供开发者与先锋测试员使用。 |`,
            '',
            '---',
            '',
            '### 🌐 多端体验与访问',
            '- 📱 **Android 原生端**：请在下方 **Assets** 附件列表中选择适合的版本直接下载安装。',
            '- 🌏 **Web 沉浸体验**：[https://weekly-mountain.pages.dev/](https://weekly-mountain.pages.dev/)',
            '',
            '> 💡 *小提示：若系统弹出“未知来源应用安装”，请在手机系统权限设置中选择“允许来自此来源的应用安装”即可畅享高山探索。*',
            ''
          ].join('\n');

          fs.writeFileSync('release_notes.md', notes, 'utf8');
          console.log('=== Generated release_notes.md ===');
          console.log(notes);
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          }
          EOF
          node generate_notes.cjs
          rm -f generate_notes.cjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_notes.outputs.title }}
          tag_name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            weekly-mountain-${{ env.TAG }}-release.apk
            weekly-mountain-${{ env.TAG }}-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Diagnostic Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostic
          path: |
            android/app/build/reports/
            android/build/reports/
            *.log
            android/*.log
          if-no-files-found: ignore
